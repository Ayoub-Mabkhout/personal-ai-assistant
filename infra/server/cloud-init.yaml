#cloud-config
# Ubuntu 24.04 LTS; no user information or credentials belong in this file.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - python3
  - ca-certificates
  - unattended-upgrades
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648
write_files:
  - path: /etc/ssh/sshd_config.d/60-assistant.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      PermitRootLogin no
runcmd:
  - [systemctl, enable, --now, docker]
  - [systemctl, restart, ssh]
  - [install, -d, -m, '0755', /opt/personal-assistant-source]
