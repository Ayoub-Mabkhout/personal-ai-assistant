name: personal-assistant

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  proxy:
    image: library/caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    environment:
      ASSISTANT_DOMAIN: ${ASSISTANT_DOMAIN:?Set the public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./${ASSISTANT_CADDY_CONFIG:-Caddyfile.bootstrap}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: 172.30.0.2
    depends_on:
      relay:
        condition: service_healthy
    logging: *logging

  relay:
    build:
      context: ../..
      dockerfile: infra/server/Dockerfile
    restart: unless-stopped
    environment:
      ASSISTANT_QUEUE_DB: /data/queue.sqlite3
      ASSISTANT_SUBMIT_TOKEN_FILE: /run/secrets/submit_token
      ASSISTANT_WORKER_TOKEN_FILE: /run/secrets/worker_token
      ASSISTANT_GROCERIES_TOKEN_FILE: /run/secrets/groceries_token
      ASSISTANT_RELEASE_PUBLISH_TOKEN_FILE: /data/release-publish-token
    secrets: [submit_token, worker_token, groceries_token]
    volumes:
      - ${ASSISTANT_DATA_DIR}/relay:/data
    ports:
      - "127.0.0.1:8765:8765"
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

secrets:
  submit_token:
    file: ${ASSISTANT_SECRET_DIR:?Set the private credential directory}/submit_token
  worker_token:
    file: ${ASSISTANT_SECRET_DIR}/worker_token
  groceries_token:
    file: ${ASSISTANT_SECRET_DIR}/groceries_token

volumes:
  caddy_data:
  caddy_config:
