name: Signed companion release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: companion-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.fork == false && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require a version tag on the default branch history
        run: python scripts/release_companion.py verify-tag
      - name: Install isolated test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Offline and fake-provider tests
        run: python -m unittest discover -s tests -v
      - name: Public source boundary
        run: python scripts/check_publication.py
      - name: Whitespace
        run: git diff --check

  build:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Android SDK packages
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ANDROID_HOME) { throw 'The hosted Android SDK is required.' }
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager '--install' 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
      - name: Prepare checksum-verified generic ARM64 wake assets
        run: |
          python scripts/fetch_vosk_runtime.py --cache "$env:RUNNER_TEMP/vosk" --abis arm64-v8a --release
          if ($LASTEXITCODE -ne 0) { throw 'Wake runtime preparation failed.' }
      - name: Stage existing signer and Android client configuration
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: python scripts/stage_android_release_secrets.py
      - name: Build and sign the normal companion
        env:
          CI: 'true'
        run: |
          python scripts/build_android_companion.py --sdk "$env:ANDROID_HOME" --wake-runtime "$env:RUNNER_TEMP/vosk/runtime.json" --firebase-config "$env:RUNNER_TEMP/personal-assistant-release-secrets/google-services.json" --output "$env:RUNNER_TEMP/artifacts/assistant-companion.apk" --signing "$env:RUNNER_TEMP/personal-assistant-release-secrets/signing" --workspace "$env:RUNNER_TEMP/android-build" --require-existing-signing
          if ($LASTEXITCODE -ne 0) { throw 'Signed companion build failed.' }
      - name: Verify the APK manifest and public artifact contents
        run: |
          python scripts/release_companion.py verify --apk "$env:RUNNER_TEMP/artifacts/assistant-companion.apk" --aapt "$env:ANDROID_HOME/build-tools/35.0.0/aapt.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact validation failed.' }
      - name: Remove secret inputs
        if: always()
        run: python scripts/stage_android_release_secrets.py --cleanup
      - name: Preserve only the verified release APK and manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-companion
          path: |
            ${{ runner.temp }}/artifacts/assistant-companion.apk
            ${{ runner.temp }}/artifacts/assistant-companion.release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-companion
          path: ${{ runner.temp }}/artifacts
      - name: Recheck exact artifact before publication
        run: python scripts/release_companion.py verify --apk "$RUNNER_TEMP/artifacts/assistant-companion.apk"
      - name: Publish exact bytes and dispatch the release update
        env:
          GH_TOKEN: ${{ github.token }}
          COMPANION_PUBLICATION_URL: ${{ secrets.COMPANION_PUBLICATION_URL }}
          COMPANION_PUBLICATION_TOKEN: ${{ secrets.COMPANION_PUBLICATION_TOKEN }}
        run: python scripts/release_companion.py publish --apk "$RUNNER_TEMP/artifacts/assistant-companion.apk"
