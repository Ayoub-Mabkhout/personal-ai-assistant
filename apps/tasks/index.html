<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task details</title><link rel="stylesheet" href="/tasks/style.css"><script src="/tasks/app.js" defer></script></head>
<body><main><header><nav><a href="/tasks/">Task history</a> <a href="/">Home Assistant</a></nav><button id="signin">Sign in</button></header><p class="eyebrow">Assistant task</p><h1 id="status">Task details</h1><p id="connection" role="status">Open a task from its notification.</p><section id="task-history-section" hidden><label for="history-search">Search tasks</label><input id="history-search" type="search" maxlength="300" placeholder="Search requests and answers"><div id="task-history-list"></div><button id="history-more" hidden>Load more</button></section><div id="task-detail-content"><section><h2>Request</h2><p id="request">—</p></section><section id="result-section" hidden><h2 id="result-title">Result</h2><pre id="result"></pre></section><section id="turns-section" hidden><h2>Follow-ups</h2><div id="turns"></div></section><section id="followup-section" hidden><h2>Continue this task</h2><form id="followup-form"><label for="instruction">New instruction</label><textarea id="instruction" maxlength="4096" rows="4" required placeholder="What should happen next?"></textarea><button id="send-followup" type="submit">Send instruction</button><p id="followup-status" role="status" aria-live="polite"></p></form></section><section><h2>Activity</h2><ol id="history"></ol></section><footer id="task-id"></footer></div></main></body></html>
