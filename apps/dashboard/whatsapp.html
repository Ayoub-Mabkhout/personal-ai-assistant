<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link WhatsApp</title><style>body{font:16px/1.6 system-ui,sans-serif;margin:40px auto;padding:0 24px;max-width:660px;background:#19191f;color:#f2efe9}h1{letter-spacing:-1px}a{color:#b9a1ec}#qr{display:block;width:360px;max-width:100%;margin:24px auto;background:white;border-radius:12px}#state{color:#d7c7eb}#remaining{color:#aba5b2;font-size:13px}[hidden]{display:none}</style><body><a href="/#profile">← Profile</a><h1>Link WhatsApp</h1><p>On your phone: <strong>WhatsApp → Settings → Linked devices → Link a device</strong>.</p><p id="state" role="status">Getting a fresh pairing code…</p><img id="qr" alt="Live WhatsApp linked-device QR code" hidden><p id="remaining"></p><p>The code refreshes automatically. Scan the code on this page.</p><script>
const token='__DASHBOARD_TOKEN__';let expires=0,current='',busy=false;const state=document.getElementById('state'),qr=document.getElementById('qr'),remaining=document.getElementById('remaining');
async function refresh(){if(busy)return;busy=true;try{const response=await fetch('/api/connections',{headers:{'X-Dashboard-Token':token}});if(!response.ok)throw Error('Please reload this page.');const {whatsapp}=await response.json();expires=Date.parse(whatsapp.qr_expires_at||'')||0;const labels={pairing:'Scan this code with your phone.',paired:'Phone linked. Establishing connection…',connected:'WhatsApp is connected.',disconnected:'Disconnected. Reconnecting…',pairing_expired:'Getting a new code…',pairing_failed:'Linking failed. Preparing another attempt…',connecting:'Connecting…',not_started:'Receiver is not running.'};state.textContent=labels[whatsapp.state]||'Preparing the connection…';const valid=whatsapp.state==='pairing'&&(!expires||expires>Date.now());if(valid){const image=await fetch('/api/whatsapp/qr',{headers:{'X-Dashboard-Token':token}});if(image.ok){const next=URL.createObjectURL(await image.blob());qr.src=next;qr.hidden=false;if(current)URL.revokeObjectURL(current);current=next}else qr.hidden=true}else qr.hidden=true;}catch(error){state.textContent=error.message;qr.hidden=true}finally{busy=false}}
setInterval(()=>{const seconds=Math.max(0,Math.ceil((expires-Date.now())/1000));remaining.textContent=!qr.hidden&&expires?'New code in '+seconds+' seconds.':'';if(expires&&seconds===0)qr.hidden=true},500);refresh();setInterval(refresh,1500);
</script></body></html>
