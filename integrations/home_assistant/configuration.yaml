default_config:

homeassistant:
  packages: !include_dir_named packages
  external_url: !env_var HA_EXTERNAL_URL
  time_zone: !env_var TZ

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.0.2
  ip_ban_enabled: true
  login_attempts_threshold: 5

shopping_list:

assistant_dispatch:
  relay_url: http://relay:8765
  authorization: !secret relay_authorization

todo:
  - platform: assistant_groceries
    url: http://relay:8765/groceries
    token: !secret groceries_token

rest_command:
  assistant_add_groceries:
    url: http://relay:8765/groceries/v1/voice
    method: POST
    headers:
      Authorization: !secret groceries_authorization
    content_type: application/json
    timeout: 10
    payload: >-
      {{ {'id': request_id, 'text': items} | to_json }}
  assistant_connection_status:
    url: http://relay:8765/v1/status
    headers:
      Authorization: !secret relay_authorization
    timeout: 10
  assistant_queue_command:
    url: http://relay:8765/v1/agent/prompts
    method: POST
    headers:
      Authorization: !secret relay_authorization
    content_type: application/json
    timeout: 10
    payload: >-
      {{ {'id': request_id, 'prompt': request,
          'timezone': timezone_name, 'created_at': created_at} | to_json }}

rest:
  - resource: http://relay:8765/v1/status
    headers:
      Authorization: !secret relay_authorization
    scan_interval: 30
    sensor:
      - name: Assistant Laptop Status
        unique_id: assistant_laptop_status
        value_template: "{{ value_json.laptop }}"
        json_attributes: [last_seen, queued]

intent_script:
  AddCloudGroceries:
    action:
      - action: rest_command.assistant_add_groceries
        data:
          request_id: "{{ context.id }}"
          items: "{{ items }}"
        response_variable: grocery_response
      - stop: Return the grocery acknowledgement
        response_variable: grocery_response
    speech:
      text: >-
        {% if action_response.status == 200 %}
          {{ action_response.content.summary }}
        {% else %}
          I could not save those items. Please try again.
        {% endif %}
  AssistantConnectionStatus:
    action:
      - action: rest_command.assistant_connection_status
        response_variable: relay_response
      - stop: Return current laptop status
        response_variable: relay_response
    speech:
      text: >-
        {% set status = action_response.content.laptop if action_response.status == 200 else 'unknown' %}
        {% if status == 'ready' %}
          The laptop is ready for commands.
        {% elif status == 'blocked' %}
          The laptop is connected but cannot run tasks right now.
        {% elif status == 'unavailable' %}
          The laptop is unavailable. You can queue a request on the server.
        {% else %}
          I cannot determine the laptop connection status right now.
        {% endif %}
